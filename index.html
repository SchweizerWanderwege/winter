<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link rel="stylesheet" type="text/css" href="resources/horsey.min.css">
        <link rel="stylesheet" type="text/css" href="resources/ol3-search-layer.min.css">
        <link href="resources/ol-geocoder.min.css" rel="stylesheet">
        <link rel="stylesheet" href="resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="resources/qgis2web.css">
        <link rel="stylesheet" href="resources/nouislider.min.css">
        <style>
        html, body {
            background-color: #ffffff;
        }
        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #444444!important;
        }
        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        } 
        </style>

        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>
        <title></title>
    </head>
    <body>
        <aside id="route-panel" class="route-panel">
            <div class="route-panel-header">
                <div>
                    <h1>Routen</h1>
                    <p id="route-panel-status">Routen werden geladen …</p>
                </div>

                <button
                    id="route-panel-close"
                    class="route-panel-close"
                    type="button"
                    title="Routenliste schliessen"
                    aria-label="Routenliste schliessen"
                >
                    ×
                </button>
            </div>

            <div class="route-panel-content">
                <div id="route-list" class="route-list"></div>
            </div>
        </aside>

        <button
            id="route-panel-open"
            class="route-panel-open"
            type="button"
            title="Routenliste öffnen"
            aria-label="Routenliste öffnen"
            hidden
        >
            Routen
        </button>
        <div class="route-search-container">

            <div id="route-search-bar" class="route-search-bar">

                <span class="route-search-icon" aria-hidden="true">⌕</span>

                <input
                    id="route-search-input"
                    type="search"
                    placeholder="Route suchen …"
                    aria-label="Route suchen"
                    autocomplete="off"
                >

                <button
                    id="route-search-clear"
                    class="route-search-clear"
                    type="button"
                    title="Suche zurücksetzen"
                    aria-label="Suche zurücksetzen"
                    hidden
                >
                    ×
                </button>

            </div>

            <div
                id="route-search-results"
                class="route-search-results"
                hidden
            >
            </div>
        </div>

        <div id="map-selection" class="map-selection">
            <div class="map-selection-pill map-selection-route-types">
                <button
                    class="map-selection-segment is-active"
                    type="button"
                    data-map-filter="www"
                    aria-pressed="true"
                    title="Winterwanderwege anzeigen"
                >
                    WWW
                </button>

                <button
                    class="map-selection-segment is-active"
                    type="button"
                    data-map-filter="ssww"
                    aria-pressed="true"
                    title="Schneeschuhwanderwege anzeigen"
                >
                    SSWW
                </button>
            </div>

            <div class="map-selection-pill map-selection-network-types">
                <button
                    class="map-selection-segment is-active"
                    type="button"
                    data-map-filter="bestof"
                    aria-pressed="true"
                    title="Best-of-Routen anzeigen"
                >
                    Best-of
                </button>

                <button
                    class="map-selection-segment is-active"
                    type="button"
                    data-map-filter="basisnetz"
                    aria-pressed="true"
                    title="Basisnetz anzeigen"
                >
                    Basisnetz
                </button>
            </div>
        </div>

        <button
            id="map-filters-open"
            class="map-filters-open"
            type="button"
            aria-controls="map-filters-panel"
            aria-expanded="false"
            title="Routenfilter öffnen"
        >
            Filter
        </button>

        <aside
            id="map-filters-panel"
            class="map-filters-panel"
            aria-label="Routenfilter"
            hidden
        >
            <div class="map-filters-header">
                <div>
                    <h2>Routen filtern</h2>
                    <p>Die Filter wirken auf Karte, Routenliste und Suche.</p>
                </div>

                <button
                    id="map-filters-close"
                    class="map-filters-close"
                    type="button"
                    aria-label="Routenfilter schliessen"
                    title="Routenfilter schliessen"
                >
                    ×
                </button>
            </div>

            <div class="map-filters-content">

                <section class="map-filter-section">
                    <div class="map-filter-heading">
                        <span>Distanz</span>

                        <span
                            id="route-distance-value"
                            class="route-distance-value"
                        >
                            Wird geladen ...
                        </span>
                    </div>

                    <div class="route-distance-limits">
                        <span id="route-distance-limit-min">Min.</span>
                        <span id="route-distance-limit-max">Max.</span>
                    </div>

                    <div id="route-distance-slider"></div>
                </section>

                <section class="map-filter-section">

                    <div class="map-filter-heading">
                        <span>Dauer</span>

                        <span
                            id="route-duration-value"
                            class="route-distance-value"
                        >
                            Wird geladen ...
                        </span>
                    </div>

                    <div class="route-distance-limits">
                        <span id="route-duration-limit-min">Min.</span>
                        <span id="route-duration-limit-max">Max.</span>
                    </div>

                    <div id="route-duration-slider"></div>

                </section>

                <section class="map-filter-section map-filter-placeholder">
                    <span>Konditionelle Schwierigkeit</span>
                    <span>Folgt</span>
                </section>

                <section class="map-filter-section map-filter-placeholder">
                    <span>Technische Schwierigkeit</span>
                    <span>Folgt</span>
                </section>

                <section class="map-filter-section map-filter-placeholder">
                    <span>Höhenlage</span>
                    <span>Folgt</span>
                </section>

            </div>

            <div class="map-filters-footer">
                <button
                    id="map-filters-reset"
                    class="map-filters-reset"
                    type="button"
                    disabled
                >
                    Filter zurücksetzen
                </button>
            </div>
        </aside>


        <div id="map">
            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
        </div>
        <script src="resources/qgis2web_expressions.js"></script>
        <script src="resources/functions.js"></script>
        <script src="resources/ol.js"></script>
        <script src="resources/horsey.min.js"></script>
        <script src="resources/ol3-search-layer.js"></script>
        <script src="resources/ol-layerswitcher.js"></script>
        <script src="resources/ol-geocoder.js"></script>
        <script src="layers/Schneeschuhwanderwege_1.js"></script><script src="layers/Winterwanderwege_3.js"></script>
        <script src="styles/Schneeschuhwanderwege_1_style.js"></script><script src="styles/Winterwanderwege_3_style.js"></script>
        <script src="layers/layers.js" type="text/javascript"></script> 
        <script src="resources/Autolinker.min.js"></script>
        <script src="resources/nouislider.min.js"></script>
        <script src="resources/qgis2web.js"></script>
        <script>
        document.addEventListener('DOMContentLoaded', function () {
            var routePanel = document.getElementById('route-panel');
            var closeButton = document.getElementById('route-panel-close');
            var openButton = document.getElementById('route-panel-open');

            closeButton.addEventListener('click', function () {
                routePanel.classList.add('route-panel-hidden');
                openButton.hidden = false;
            });

            openButton.addEventListener('click', function () {
                routePanel.classList.remove('route-panel-hidden');
                openButton.hidden = true;
            });
        });
        </script>
    </body>
</html>
